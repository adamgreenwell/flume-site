<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    Flume app icon.

    The mark is centred on its *stroked* bounding box, not on the 32-unit
    drawing grid. Those are not the same box — the glyph sits low and right of
    centre in the grid, so scaling it naively leaves it visibly off-centre in a
    dock. Box (including the 6.2 stroke) is x 5.9-29.7, y 1.4-31.5, centred on
    (17.8, 16.45); the transform below maps that centre to (512, 512) at a
    scale that leaves the artwork about 55% of the canvas, which is roughly
    where macOS sets its own.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2c2925"/>
      <stop offset="1" stop-color="#131110"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#g)"/>
  <g transform="translate(180.9 206) scale(18.6)" fill="none" stroke="#5ab8ea"
     stroke-width="6.2" stroke-linecap="round">
    <path d="M9 28.4V9.6A5.1 5.1 0 0 1 14.1 4.5H26.6"/>
    <path d="M9 15.2H20"/>
  </g>
</svg>
